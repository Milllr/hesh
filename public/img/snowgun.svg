<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180">
  <defs>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0D4D8"/>
      <stop offset="25%" stop-color="#B8BEC4"/>
      <stop offset="50%" stop-color="#A0A8B0"/>
      <stop offset="75%" stop-color="#B8BEC4"/>
      <stop offset="100%" stop-color="#8A9298"/>
    </linearGradient>
    <linearGradient id="orange1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5921E"/>
      <stop offset="30%" stop-color="#E8780A"/>
      <stop offset="70%" stop-color="#D06808"/>
      <stop offset="100%" stop-color="#B85A06"/>
    </linearGradient>
    <linearGradient id="tripodLeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0B6BC"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="hose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC3322"/>
      <stop offset="50%" stop-color="#AA2211"/>
      <stop offset="100%" stop-color="#881808"/>
    </linearGradient>
  </defs>

  <!-- RED HOSES running along ground to base -->
  <path d="M0 158 Q30 155 55 148 Q70 142 78 132" stroke="url(#hose)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M0 168 Q25 165 50 158 Q68 150 75 138" stroke="url(#hose)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Hose highlight -->
  <path d="M5 155 Q30 152 55 145" stroke="rgba(255,180,150,0.25)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- TRIPOD BASE -->
  <!-- Back leg -->
  <line x1="72" y1="128" x2="32" y2="175" stroke="url(#tripodLeg)" stroke-width="5" stroke-linecap="round"/>
  <!-- Front leg -->
  <line x1="88" y1="128" x2="118" y2="175" stroke="url(#tripodLeg)" stroke-width="5" stroke-linecap="round"/>
  <!-- Cross brace -->
  <line x1="48" y1="155" x2="105" y2="155" stroke="#909AA0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tripod feet -->
  <ellipse cx="32" cy="176" rx="6" ry="2.5" fill="#707880"/>
  <ellipse cx="118" cy="176" rx="6" ry="2.5" fill="#707880"/>

  <!-- BASE HOUSING (control box / swivel) -->
  <rect x="62" y="112" width="36" height="28" rx="3" fill="#F5921E" stroke="#D06808" stroke-width="1"/>
  <!-- Control panel face -->
  <rect x="66" y="116" width="14" height="10" rx="1" fill="#E8E8E8" stroke="#888" stroke-width="0.5"/>
  <!-- Indicator lights -->
  <circle cx="70" cy="120" r="1.5" fill="#44CC44"/>
  <circle cx="76" cy="120" r="1.5" fill="#CC4444"/>
  <!-- Valve wheel -->
  <circle cx="90" cy="124" r="5" fill="none" stroke="#888" stroke-width="2"/>
  <circle cx="90" cy="124" r="1.5" fill="#666"/>

  <!-- MAIN POLE - long galvanized steel pipe, angled upward to the right -->
  <line x1="80" y1="116" x2="430" y2="52" stroke="url(#pole)" stroke-width="14" stroke-linecap="round"/>
  <!-- Pole highlight (reflection) -->
  <line x1="90" y1="113" x2="425" y2="49.5" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
  <!-- Pole shadow -->
  <line x1="85" y1="120" x2="428" y2="56" stroke="rgba(0,0,0,0.1)" stroke-width="3" stroke-linecap="round"/>

  <!-- Joint clamp where pole meets base -->
  <rect x="72" y="108" width="20" height="12" rx="2" fill="#909AA0" stroke="#707880" stroke-width="1"/>
  <line x1="78" y1="108" x2="78" y2="120" stroke="#808890" stroke-width="1"/>
  <line x1="86" y1="108" x2="86" y2="120" stroke="#808890" stroke-width="1"/>

  <!-- Pole support clamps along length -->
  <g transform="translate(180,92) rotate(-8.3)">
    <rect x="-5" y="-8" width="10" height="16" rx="2" fill="#A0A8B0" stroke="#808890" stroke-width="0.7"/>
  </g>
  <g transform="translate(280,75) rotate(-8.3)">
    <rect x="-5" y="-8" width="10" height="16" rx="2" fill="#A0A8B0" stroke="#808890" stroke-width="0.7"/>
  </g>
  <g transform="translate(370,60) rotate(-8.3)">
    <rect x="-5" y="-8" width="10" height="16" rx="2" fill="#A0A8B0" stroke="#808890" stroke-width="0.7"/>
  </g>

  <!-- NOZZLE HEAD - orange cylindrical multi-ring nozzle -->
  <g transform="translate(430,48) rotate(-8.3)">
    <!-- Adapter collar -->
    <rect x="-8" y="-10" width="16" height="20" rx="3" fill="#909AA0" stroke="#707880" stroke-width="1"/>

    <!-- Orange nozzle body - stacked rings -->
    <rect x="-2" y="-38" width="18" height="8" rx="2" fill="url(#orange1)" stroke="#B85A06" stroke-width="0.5"/>
    <rect x="-2" y="-29" width="18" height="8" rx="2" fill="url(#orange1)" stroke="#B85A06" stroke-width="0.5"/>
    <rect x="-2" y="-20" width="18" height="8" rx="2" fill="url(#orange1)" stroke="#B85A06" stroke-width="0.5"/>
    <rect x="-2" y="-11" width="18" height="8" rx="2" fill="url(#orange1)" stroke="#B85A06" stroke-width="0.5"/>

    <!-- Nozzle spray holes (brass fittings) -->
    <circle cx="17" cy="-34" r="2.5" fill="#C8A830" stroke="#A08820" stroke-width="0.5"/>
    <circle cx="17" cy="-25" r="2.5" fill="#C8A830" stroke="#A08820" stroke-width="0.5"/>
    <circle cx="17" cy="-16" r="2.5" fill="#C8A830" stroke="#A08820" stroke-width="0.5"/>
    <circle cx="17" cy="-7" r="2.5" fill="#C8A830" stroke="#A08820" stroke-width="0.5"/>

    <!-- Top cap -->
    <rect x="0" y="-42" width="14" height="5" rx="2" fill="#D06808" stroke="#B85A06" stroke-width="0.5"/>

    <!-- Bolts on rings -->
    <circle cx="2" cy="-34" r="1" fill="#888"/>
    <circle cx="2" cy="-25" r="1" fill="#888"/>
    <circle cx="2" cy="-16" r="1" fill="#888"/>
    <circle cx="2" cy="-7" r="1" fill="#888"/>
  </g>

  <!-- Frost/ice on pole near nozzle -->
  <g opacity="0.3">
    <circle cx="400" cy="56" r="3" fill="white"/>
    <circle cx="410" cy="53" r="2.5" fill="white"/>
    <circle cx="395" cy="58" r="2" fill="white"/>
    <circle cx="420" cy="51" r="4" fill="white"/>
    <circle cx="415" cy="55" r="2" fill="white"/>
  </g>
</svg>