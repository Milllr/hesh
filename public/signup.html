<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>backyard rail - sign up</title>
<meta name="theme-color" content="#eef1f3">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png">
<link rel="preload" href="fonts/hubot-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Hubot Sans'; src: url('fonts/hubot-sans.woff2') format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
  @font-face { font-family: 'Michroma'; src: url('fonts/michroma.woff2') format('woff2'); font-display: swap; }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* Layout: the main site's top bar, one wide shot with the bloom treatment, then the form beside what you get. Phone first: the form sits right under the shot. */
  :root {
    --snow: #eef1f3;
    --snow-2: #dfe4e8;
    --ink: #111316;
    --ink-2: #545c66;
    --ramp: #ff6b1f;
    --sans: 'Hubot Sans', 'Helvetica Neue', Arial, sans-serif;
    --caps: 'Michroma', 'Eurostile', 'Arial Black', sans-serif;
  }

  body {
    background: var(--snow);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ramp); outline-offset: 3px; }
  .caps { font: 10px/1.6 var(--caps); letter-spacing: .14em; text-transform: uppercase; }
  .mark { font-family: var(--sans); font-stretch: 125%; font-weight: 200; letter-spacing: -.03em; line-height: .95; }
  .mark b { font-weight: 800; }

  /* top bar, as on the main site */
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
    background: rgba(238, 241, 243, .9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--ink);
  }
  .top .mark { font-size: 19px; text-decoration: none; }
  .top .back { font-size: 9px; text-decoration: none; display: flex; align-items: center; gap: 7px; }
  .top .back::before { content: ""; width: 6px; height: 6px; background: var(--ramp); }

  /* the shot: soften + saturate, a thresholded blurred copy screened over it, vignette + grade */
  .shot { position: relative; overflow: hidden; isolation: isolate; background: var(--snow-2); }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 50%); filter: saturate(1.3) contrast(1.06) blur(.5px); }
  .shot img.glow { pointer-events: none; mix-blend-mode: screen; opacity: var(--bloom, .55); filter: brightness(.5) contrast(5) brightness(2) saturate(1.6) blur(20px); }
  .shot > .fx {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(0deg, rgba(5, 6, 8, .62), transparent 60%),
      radial-gradient(120% 95% at 50% 42%, transparent 52%, rgba(4, 5, 8, .6) 100%),
      linear-gradient(170deg, rgba(255, 190, 120, .16), transparent 45%, rgba(30, 110, 140, .18));
  }
  .band { width: 100%; aspect-ratio: 2.39 / 1; min-height: 220px; max-height: 46vh; --pos: 50% 55%; }
  .band-over {
    position: absolute; inset: auto 0 0 0; z-index: 2; color: var(--snow);
    display: grid; gap: 10px;
    padding: 0 max(28px, env(safe-area-inset-right, 0px)) 26px max(28px, env(safe-area-inset-left, 0px));
  }
  .band-over h1 { font-size: clamp(3rem, 9vw, 7rem); text-shadow: 0 0 22px rgba(255, 217, 163, .4), 0 0 60px rgba(255, 107, 31, .25); }
  .band-over .caps { color: var(--snow); }
  @media (max-width: 600px) { .band { aspect-ratio: 16 / 10; } .band-over { padding: 0 20px 18px; } }

  /* form + what you get */
  .page {
    position: relative;
    padding: 44px max(20px, env(safe-area-inset-right, 0px)) 64px max(20px, env(safe-area-inset-left, 0px));
  }
  .page > * { max-width: 1000px; margin-inline: auto; }
  /* the orange slab from the main site, off the right edge */
  .page::before {
    content: ""; position: absolute; right: 0; top: 0; width: 22%; height: 150px; pointer-events: none;
    background: var(--ramp); clip-path: polygon(40% 0, 100% 0, 100% 100%, 0 0);
  }
  .grid { position: relative; display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 40px 72px; align-items: start; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .page { padding-top: 32px; }
    .page::before { width: 34%; height: 70px; }
  }

  label {
    display: block;
    font: 9px/1.6 var(--caps);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 0.4rem;
    margin-top: 1.2rem;
  }
  label:first-child { margin-top: 0; }

  input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.05rem;
    padding: 0.9rem;
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
  }

  input:focus { border-color: var(--ramp); box-shadow: inset 0 0 0 1px var(--ramp); }
  input::placeholder { color: #9aa2ab; }

  button {
    margin-top: 1.6rem;
    width: 100%;
    background: var(--ink);
    color: var(--snow);
    border: none;
    border-radius: 0;
    font: 13px/1 var(--caps);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 1.45rem;
    cursor: pointer;
    transition: background .2s, color .2s;
  }

  button:hover, button:active { background: var(--ramp); color: var(--ink); }
  button:disabled { background: var(--ink-2); color: var(--snow); cursor: wait; }

  .side { display: grid; gap: 22px; align-content: start; padding-top: 4px; }
  .perks { list-style: none; display: grid; gap: 12px; }
  .perks li { display: flex; align-items: center; gap: 12px; font-size: 1.35rem; font-stretch: 112%; font-weight: 300; }
  .perks li::before { content: ""; flex: 0 0 10px; height: 10px; background: var(--ramp); }

  .sep { height: 1px; background: var(--ink); opacity: 0.15; margin: 1.8rem 0; max-width: 420px; }

  .ig {
    display: block;
    max-width: 420px;
    text-align: center;
    padding: 1rem;
    border: 1px solid var(--ink);
    color: var(--ink);
    text-decoration: none;
    font-family: var(--sans);
    font-stretch: 112%;
    font-weight: 600;
    font-size: 1.05rem;
    transition: background .2s, color .2s;
  }

  .ig:hover, .ig:active { background: var(--ink); color: var(--snow); }

  .ig-label {
    font: 9px/1.6 var(--caps);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: -12px;
  }

  .done { display: none; position: relative; }
  .done > * { max-width: 420px; }

  .done h2 {
    font-family: var(--sans);
    font-stretch: 125%;
    font-weight: 200;
    font-size: 2.6rem;
    letter-spacing: -0.03em;
    line-height: .95;
    margin-bottom: 0.8rem;
  }
  .done h2 b { font-weight: 800; }

  .done p {
    font-size: 1rem;
    color: var(--ink-2);
    line-height: 1.6;
    margin-bottom: 1rem;
  }

  .done .ig-label { margin-bottom: 0.6rem; }

  .done .ig-followed {
    font-size: 0.55rem;
    color: var(--ink-2);
    letter-spacing: 0.1em;
    margin-top: 0.8rem;
    opacity: 0.5;
  }

  .err { border-color: var(--ramp) !important; box-shadow: inset 0 0 0 1px var(--ramp); }
  /* the bot trap: off screen for people, still in the form for scripts that fill every field */
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  /* turnstile only takes room when Cloudflare asks for a tap */
  .ts:not(:empty) { margin-top: 1.2rem; }
  .form-err { margin-top: 1rem; padding-left: .7rem; border-left: 3px solid var(--ramp); font-size: .95rem; color: var(--ink); }
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="/">backyard<b>rail</b></a>
  <a class="caps back" href="/">hesh.ca</a>
</header>

<section class="shot band">
  <img src="img/redbull/crew-redbull.jpg" alt="The crew at Red Bull Snow Day">
  <div class="band-over">
    <p class="caps">get on the list</p>
    <h1 class="mark">sign<b>up</b></h1>
  </div>
</section>

<main class="page">
<div id="formWrap" class="grid">
  <form id="f" onsubmit="return go(event)">
    <label for="n">name</label>
    <input type="text" id="n" placeholder="your name" required maxlength="80" autocomplete="name">

    <label for="e">email</label>
    <input type="email" id="e" placeholder="you@email.com" required maxlength="120" autocomplete="email">

    <label for="p">phone</label>
    <input type="tel" id="p" placeholder="xxx-xxx-xxxx" maxlength="25" autocomplete="tel">

    <div class="hp" aria-hidden="true"><label for="hp">leave this empty</label><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>

    <div id="ts" class="ts"></div>
    <button type="submit" id="btn">sign me up</button>
    <p class="form-err" id="formErr" role="alert" hidden></p>
  </form>

  <div class="side">
    <ul class="perks">
      <li>future jams</li>
      <li>merch drops</li>
      <li>updates</li>
    </ul>
    <p class="ig-label">follow us</p>
    <a href="https://instagram.com/backyardrail" target="_blank" rel="noopener" class="ig" id="igBtn" onclick="trackIG()">@backyardrail</a>
  </div>
</div>

<div class="done" id="done">
  <h2>you're <b>in</b></h2>
  <p>we'll hit you up for the next jam.</p>
  <div class="sep"></div>
  <p class="ig-label">follow us</p>
  <a href="https://instagram.com/backyardrail" target="_blank" rel="noopener" class="ig" id="igBtn2" onclick="trackIG()">follow @backyardrail</a>
  <p class="done .ig-followed" id="igNote" style="display:none;font-size:0.5rem;color:#545c66;margin-top:0.5rem;opacity:0.5;">clicked</p>
</div>
</main>

<script>
// BLOOM, as on the main site: a blurred, thresholded copy screened over the photo, plus the grade layer
document.querySelectorAll('.shot > img').forEach(function(img) {
  var glow = img.cloneNode();
  glow.className = 'glow'; glow.alt = ''; glow.setAttribute('aria-hidden', 'true');
  var fx = document.createElement('i');
  fx.className = 'fx';
  img.after(glow, fx);
});
</script>

<script>
// Signups go to /api/signup (functions/api/signup.js), which checks the Turnstile token,
// the fields and a rate limit on the server, then saves to the hesh-signups D1 database.
var SITEKEY = '0x4AAAAAAFh67GndN90Cg2WX';   // the "hesh.ca signup" Turnstile widget

// Detect source from URL param: ?src=booth-qr or default to "site" (anyone can edit a link, so keep it to a short slug)
var params = new URLSearchParams(window.location.search);
var SOURCE = (params.get('src') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 40) || 'site';

// Track if user clicked Instagram
var clickedIG = false;
var signupId = '';

// Signups used to be kept in this browser too, which piled up every visitor's name, email and phone
// on a shared booth device. Nothing personal is stored here now, and whatever an older version left is cleared.
try { localStorage.removeItem('signups'); } catch (x) {}

// TURNSTILE: rendered on load and hidden unless Cloudflare wants an interaction. Tokens are single use,
// so each attempt takes the current one and a refused attempt resets the widget for a fresh one.
// Cloudflare can take a while to decide, and on busy shared networks (Western's wifi) it often asks for a
// tap on "verify you are human". So a submit waits for the token, says what's going on, and sends the
// moment the token arrives. It used to give up after 20 seconds and reset the widget, which hid the box
// people needed to tap and left them stuck on "couldn't check you're a person".
var widgetId = null, token = '', waiting = null, needsTap = false;
var TOKEN_WAIT_MS = 120000;
var TAP = 'tap "verify you are human" above to finish signing up';
window.onTurnstile = function() {
  widgetId = turnstile.render('#ts', {
    sitekey: SITEKEY,
    action: 'signup',
    appearance: 'interaction-only',
    theme: 'light',
    size: 'flexible',
    'refresh-expired': 'auto',
    callback: function(t) {
      token = t; needsTap = false;
      if (waiting) { var w = waiting; waiting = null; say(''); w(); }
    },
    'expired-callback': function() { token = ''; },
    'before-interactive-callback': function() {
      needsTap = true;
      tk('form', 'turnstile asked for a tap');
      if (waiting) say(TAP);
    },
    'after-interactive-callback': function() { needsTap = false; },
    'error-callback': function(code) {
      token = '';
      tk('form', 'turnstile error ' + code);
      if (waiting) say('still checking you\'re a person, hang on a sec');
    }
  });
};

// a line under the button for what's happening; empty hides it
function say(msg) {
  var el = document.getElementById('formErr');
  el.textContent = msg;
  el.hidden = !msg;
}

function withToken(cb) {
  function take() { var t = token; token = ''; cb(t); }
  if (token) return take();
  waiting = take;
  document.getElementById('btn').textContent = 'checking you\'re a person...';
  say(needsTap ? TAP : '');
  setTimeout(function() { if (waiting === take) { waiting = null; cb(''); } }, TOKEN_WAIT_MS);
}

// the site tracker (t.js), when it loaded
function tk(type, label) { if (window.heshTrack) window.heshTrack(type, label); }

function trackIG() {
  clickedIG = true;
  tk('instagram', signupId ? 'after signing up' : 'before signing up');
  // after signing up, mark that signup; before, it rides along with the form
  if (signupId && navigator.sendBeacon) {
    navigator.sendBeacon('/api/instagram', new Blob([JSON.stringify({ id: signupId })], { type: 'application/json' }));
  }
  var note = document.getElementById('igNote');
  if (note) note.style.display = 'block';
}

function showDone() {
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('done').style.display = 'block';
}

// keepWidget: the widget never gave us a token, so leave it as it is (resetting would hide a tap box
// someone is about to use). Otherwise the token was spent and the widget needs a fresh one.
function failed(msg, keepWidget) {
  tk('form', 'refused: ' + msg);
  say(msg);
  var btn = document.getElementById('btn');
  btn.disabled = false;
  btn.textContent = 'sign me up';
  if (keepWidget) return;
  token = '';
  if (widgetId !== null) turnstile.reset(widgetId);
}

function go(e) {
  e.preventDefault();
  var n = document.getElementById('n').value.trim();
  var em = document.getElementById('e').value.trim();
  var p = document.getElementById('p').value.trim();

  // a field people never see; only form-filling bots fill it in. Act as if it worked and send nothing.
  if (document.getElementById('hp').value) { showDone(); return false; }

  document.getElementById('formErr').hidden = true;
  document.querySelectorAll('input').forEach(function(i) { i.classList.remove('err'); });
  if (!n || n.length > 80) { document.getElementById('n').classList.add('err'); return false; }
  if (!em || em.length > 120 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { document.getElementById('e').classList.add('err'); return false; }
  if (p && !/^[0-9 +().-]{7,25}$/.test(p)) { document.getElementById('p').classList.add('err'); return false; }

  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'one sec...';

  tk('form', 'submit');
  // the check never loaded (an ad blocker, or no connection to Cloudflare): say so now rather than wait
  if (!window.turnstile || widgetId === null) return failed('the person check didn\'t load. turn off any ad blocker or try another browser');
  withToken(function(t) {
    if (!t) return needsTap
      ? failed('tap "verify you are human" above, then hit sign me up again', true)
      : failed('couldn\'t check you\'re a person, reload the page and try again');
    btn.textContent = 'one sec...';
    fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: n, email: em, phone: p, source: SOURCE, instagram: clickedIG, token: t })
    })
      .then(function(r) { return r.json().catch(function() { return {}; }).then(function(d) { return { ok: r.ok, d: d }; }); })
      .then(function(res) {
        if (res.ok && res.d.id) { signupId = res.d.id; tk('signup', SOURCE); showDone(); }
        else failed(res.d.error || 'that didn\'t go through, try again');
      })
      .catch(function() { failed('no connection, try again'); });
  });

  return false;
}
</script>
<script src="/t.js" defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstile" async defer></script>
